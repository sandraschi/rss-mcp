[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-mcp"
version = "0.1.0"
description = "Superduper local-first RSS reader + readability extractor - subscribe to feeds, get clean article text without ad sites, full-text + semantic search."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "defusedxml>=0.7",
    "trafilatura>=1.10",
    "beautifulsoup4>=4.12",
    "readability-lxml>=0.8",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.32",
    "lancedb>=0.30",
    "fastembed>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0,<0.17",
    "respx>=0.22",
    "pillow>=10",
    "pyright>=1.1.390",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0,<0.17",
    "respx>=0.22",
    "pillow>=10",
    "pyright>=1.1.390",
]

[project.urls]
Homepage = "https://github.com/sandraschi/rss-mcp"
Repository = "https://github.com/sandraschi/rss-mcp"
Issues = "https://github.com/sandraschi/rss-mcp/issues"

[project.scripts]
rss-mcp = "rss_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rss_mcp --cov-fail-under=60"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF", "T20"]
ignore = ["S101", "S603", "S607", "S324", "E501", "S310", "B008", "RUF002", "S106", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"scripts/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
